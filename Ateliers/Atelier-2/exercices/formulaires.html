<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercices sur les formulaires</title>
</head>
<body>
    <h1>Exercices sur les formulaires HTML</h1>

    <!-- Exercice 11: Formulaire d'inscription avec méthode POST -->
    <section>
        <h2>Formulaire d'inscription</h2>
        <!-- À COMPLÉTER: Créer le formulaire d'inscription -->
         <form action="resultat.html" method="POST">
            <label for="Nom complet">Nom:</label>
            <input type="text" id="nom" name="nom" required><br><br>

            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required><br><br>

            <label for="motdepasse">Mot de passe:</label>
            <input type="password" id="motdepasse" name="motdepasse" required><br><br>

            <input type="submit" value="S'inscrire">
         <!-- Champs ici -->
         </form>


    </section>

    <!-- Exercice 12: Formulaire de contact avec méthode GET -->
    <section>
        <h2>Formulaire de contact</h2>
        <!-- À COMPLÉTER: Créer le formulaire de contact -->
         <form action="../resultats/contact.html" method="GET">
            <label for="sujet">Sujet:</label>
            <input type="text" id="sujet" name="sujet" required><br><br>

            <label for="message">Message:</label>
            <textarea name="message" rows="5" cols="40" placeholder="Votre message" required></textarea><br><br> 
            
            <label for="priorite">Priorité:</label>
            <select name="priorite" id="priorite">
                <option value="haute">Haute</option>
                <option value="moyenne">Moyenne</option>
                <option value="basse">Basse</option><br><br> 

            <input type="submit" value="Envoyer">
         </form>
    </section>

    <!-- Exercice 13: Formulaire avec validation -->
    <section>
        <h2>Formulaire de commande</h2>
        <!-- À COMPLÉTER: Créer le formulaire avec validation -->
            <form action="../resultats/commande.html" method="POST">
                <label for="quantite">Quantité:</label>
                <input type="number" id="quantite" name="quantite" min="1" required><br><br>
                
                <label for="produit">Produit:</label>
                <input type="text" id="produit" name="produit" required><br><br>
    
                <label for="quantite">Quantité:</label>
                <input type="number" id="quantite" name="quantite" min="1" required><br><br>
    
                <label for="adresse">Adresse de livraison:</label>
                <textarea name="adresse" rows="5" cols="40" placeholder="Votre adresse" required></textarea><br><br> 
    
                <input type="submit" value="Commander">
            </form>
    </section>

    <!-- Navigation -->
    <nav>
        <!-- À COMPLÉTER: Liens de navigation relatifs -->
    </nav>
</body>
</html>
